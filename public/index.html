<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AssetOps Intelligence Pill</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">A</div>
          <div>
            <strong>AssetOps</strong>
            <span>Intelligence Pill</span>
          </div>
        </div>
        <nav id="nav" class="nav" aria-label="Main navigation"></nav>
      </aside>

      <main class="shell">
        <header class="topbar">
          <div class="page-title-group">
            <h1 id="page-title">Sign in</h1>
            <a class="button primary" href="/cases/new" data-new-case hidden><span aria-hidden="true">+</span> New case</a>
            <a class="button primary" href="/studio/new" data-new-pill hidden><span aria-hidden="true">+</span> Create Pill</a>
          </div>
          <div class="context" hidden>
            <span data-account-role></span>
            <strong data-account-username></strong>
          </div>
        </header>

        <div id="page" aria-live="polite"></div>
      </main>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
